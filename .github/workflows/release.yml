name: Rust Release

# Flujo:
#   validate ──┬── build-linux ───┐
#              ├── build-windows ─┼── publish
#              └── build-macos ───┘  (opcional: si falla, se publica sin Mac)
# Las tres plataformas compilan en paralelo y cada una firma sus paquetes y los deja como artefacto.
# La release de GitHub se crea al final, de una vez, así que nunca queda a medias.
# Los e2e no corren aquí (necesitan pantalla y tauri-driver); las comprobaciones rápidas están en ci.yml
# y se repiten en `validate` por si el tag se empuja antes de que ci.yml termine.
#
# Caché: GitHub solo comparte entre refs los cachés guardados en la rama por defecto; el que guarda un tag
# solo lo ve ese tag, así que cada release empezaba en frío. Por eso este workflow también corre en `main`
# (cuando cambian las dependencias y una vez por semana) solo para compilar y dejar el caché calentado,
# sin firmar ni publicar nada. Cada SO tiene su propio caché (rust-cache incluye el SO y el target en la clave).

on:
  workflow_dispatch: # <- Esto habilita el botón manual
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+*"
    # Calentar el caché en main cuando cambian las dependencias
    branches: [main]
    paths:
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - ".github/workflows/release.yml"
  schedule:
    - cron: "17 6 * * 1" # lunes: el caché de GitHub expira a los 7 días sin uso

# Permisos mínimos: solo lectura por defecto; `publish` es el único job que los eleva.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  # true en un tag: firmar y publicar; en main solo se compila para el caché
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    name: Validate tag, changelog and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Verify tag and changelog
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 ci/release.py "$TAG" --generate-notes release-notes.md

      - name: Typecheck
        run: bun run check

      - name: Unit tests
        run: bun test src/

      - name: Upload release notes
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: release-notes.md

  build-linux:
    name: Build Linux
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "synapse-release-linux"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache APT Packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            clang lld mold llvm nasm

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build
        run: bun tauri build --no-bundle

      - name: Package and sign
        if: env.IS_RELEASE == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp src-tauri/target/release/synapsers dist/synapsers
          tar -czf dist/synapsers-linux-x86_64.tar.gz -C dist synapsers
          bun tauri signer sign dist/synapsers-linux-x86_64.tar.gz --app-version "${TAG#v}"

      - if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-linux
          path: dist/

  build-windows:
    name: Build Windows
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-xwin

      - name: Rust Cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "synapse-release-windows"

      - name: Cache xwin (MSVC CRT y SDK)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/xwin
          key: ${{ runner.os }}-xwin-0.23.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install cross-compilation dependencies
        run: |
          # Solo herramientas del host: el destino es Windows (WebView2), no hacen falta las
          # bibliotecas GTK/WebKit de Linux.
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang lld llvm nasm
          # Garantizar que llvm-lib exista en el PATH si la distro solo provee llvm-ar
          if ! command -v llvm-lib &> /dev/null; then
            sudo ln -sf "$(command -v llvm-ar)" /usr/local/bin/llvm-lib
          fi

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build
        run: bun tauri build --no-bundle --target x86_64-pc-windows-msvc --runner cargo-xwin

      - name: Package and sign
        if: env.IS_RELEASE == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp src-tauri/target/x86_64-pc-windows-msvc/release/synapsers.exe dist/synapsers.exe
          (cd dist && zip -9 synapsers-windows-x86_64.zip synapsers.exe)
          bun tauri signer sign dist/synapsers-windows-x86_64.zip --app-version "${TAG#v}"

      - if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-windows
          path: dist/

  # Sin firma de Apple (no hay cuenta de desarrollador): macOS pedirá abrirlo con clic derecho → Abrir.
  build-macos:
    name: Build macOS
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "synapse-release-macos-cache"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build (Apple Silicon)
        run: bun tauri build --bundles app --target aarch64-apple-darwin

      - name: Package and sign
        if: env.IS_RELEASE == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          app_dir="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          app="$(basename "$(ls -d "$app_dir"/*.app | head -n1)")"
          out="dist/synapsers-darwin-aarch64.app.tar.gz"
          tar -czf "$out" -C "$app_dir" "$app"
          bun tauri signer sign "$out" --app-version "${TAG#v}"

      - if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-macos
          path: dist/

  # Inventario de dependencias (CycloneDX) del backend Rust y del frontend. Corre también en main para
  # que un fallo de la herramienta se vea antes de etiquetar; solo en un tag se sube como artefacto.
  sbom:
    name: SBOM (CycloneDX)
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-cyclonedx@0.5.10,syft@1.55.0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # Solo dependencias de producción: el SBOM describe lo que va en la app
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --production --ignore-scripts

      - name: Generate SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom
          (cd src-tauri && cargo cyclonedx --format json)
          rust_sbom="$(find src-tauri -maxdepth 2 -name '*.cdx.json' | head -n1)"
          test -n "$rust_sbom"
          mv "$rust_sbom" "sbom/synapsers-${TAG#v}-rust.cdx.json"
          # cyclonedx-npm necesita npm (con bun falla por npm_execpath y por los overrides):
          # syft lee los package.json de node_modules
          SYFT_FILE_METADATA_SELECTION=none syft scan dir:. --source-name synapse-frontend \
            --override-default-catalogers javascript-package-cataloger \
            -o "cyclonedx-json=sbom/synapsers-${TAG#v}-frontend.cdx.json" -q
          ls -l sbom

      - if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/

  publish:
    name: Publish release
    needs: [validate, build-linux, build-windows, build-macos, sbom]
    # Mac es opcional: se publica aunque falle, siempre que Linux, Windows y el SBOM estén bien
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.validate.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.sbom.result == 'success'
    runs-on: ubuntu-24.04
    # Único job con permisos elevados: crea la release y firma las attestations (OIDC de Sigstore).
    # No compila nada: solo trabaja con los artefactos de los jobs anteriores.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, pathlib
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          d = pathlib.Path("artifacts")
          files = {
              "linux-x86_64": "synapsers-linux-x86_64.tar.gz",
              "windows-x86_64": "synapsers-windows-x86_64.zip",
              "darwin-aarch64": "synapsers-darwin-aarch64.app.tar.gz",
          }
          platforms = {}
          for platform, name in files.items():
              sig = d / f"{name}.sig"
              if not sig.exists():
                  print(f"::warning::Sin paquete para {platform}; se publica sin esa plataforma")
                  continue
              platforms[platform] = {
                  "signature": sig.read_text().strip(),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
              }
          latest = {
              "version": tag.removeprefix("v"),
              "notes": f"Synapse release {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          (d / "latest.json").write_text(json.dumps(latest, indent=2))
          PY

      # Procedencia firmada con Sigstore (la gestiona GitHub; no se añade Cosign aparte). Se verifica con
      # `gh attestation verify <archivo> --repo Miuler/synapse.rs`. No altera los archivos ni sus .sig.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip

      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.tar.gz *.zip *.sig *.cdx.json latest.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd artifacts
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            *.tar.gz *.zip *.sig \
            *.cdx.json \
            latest.json \
            SHA256SUMS.txt
