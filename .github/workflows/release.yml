name: Rust Release

on:
  workflow_dispatch: # <- Esto habilita el botón manual
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, test and release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cargo-xwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> src-tauri/target"
          cache-directories: |
            ~/.xwin-cache

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache APT Packages
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          # La clave cambia si modificas la lista de paquetes o semanalmente para evitar derivas
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            clang \
            lld \
            llvm \
            nasm
          
          # Garantizar que llvm-lib exista en el PATH si la distro solo provee llvm-ar
          if ! command -v llvm-lib &> /dev/null; then
            sudo ln -sf "$(command -v llvm-ar)" /usr/local/bin/llvm-lib
          fi

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Verify tag and changelog
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 ci/release.py "$TAG" --generate-notes release-notes.md

      - name: Build release (Linux)
        run: bun tauri build --no-bundle

      - name: Build release (Windows)
        run: bun tauri build --no-bundle --target x86_64-pc-windows-msvc --runner cargo-xwin

      - name: Package and sign updater bundles
        env:
          TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          mkdir -p dist-release
          cp src-tauri/target/release/synapsers dist-release/synapsers
          cp src-tauri/target/x86_64-pc-windows-msvc/release/synapsers.exe dist-release/synapsers.exe

          # Comprimir bundles para updater
          tar -czf dist-release/synapsers-linux-x86_64.tar.gz -C dist-release synapsers
          (cd dist-release && zip -9 synapsers-windows-x86_64.zip synapsers.exe)

          # Firmar los bundles
          bun tauri signer sign dist-release/synapsers-linux-x86_64.tar.gz --app-version "$VERSION"
          bun tauri signer sign dist-release/synapsers-windows-x86_64.zip --app-version "$VERSION"

          LINUX_SIG=$(cat dist-release/synapsers-linux-x86_64.tar.gz.sig)
          WINDOWS_SIG=$(cat dist-release/synapsers-windows-x86_64.zip.sig)
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Generar manifiesto latest.json para el plugin updater de Tauri v2
          cat <<EOF > dist-release/latest.json
          {
            "version": "${VERSION}",
            "notes": "Synapse release ${TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/synapsers-linux-x86_64.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/synapsers-windows-x86_64.zip"
              }
            }
          }
          EOF

          # Validar formato json
          python3 -m json.tool dist-release/latest.json > dist-release/latest.formatted.json
          mv dist-release/latest.formatted.json dist-release/latest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            dist-release/synapsers \
            dist-release/synapsers.exe \
            dist-release/synapsers-linux-x86_64.tar.gz \
            dist-release/synapsers-linux-x86_64.tar.gz.sig \
            dist-release/synapsers-windows-x86_64.zip \
            dist-release/synapsers-windows-x86_64.zip.sig \
            dist-release/latest.json
