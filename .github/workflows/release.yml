name: Rust Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, test and release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Verify tag and changelog
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          tag = os.environ["TAG"]
          changelog_path = Path("CHANGELOG.md")

          tag_pattern = r"^(?:v)?((?:[0-9]+(?:\.[0-9]+)+(?:-[0-9a-zA-Z.]+)?)|(?:(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)))$"
          m_tag = re.fullmatch(tag_pattern, tag)
          if not m_tag:
              sys.exit(f"ERROR: Invalid release tag: {tag}")

          if not changelog_path.is_file():
              sys.exit("ERROR: CHANGELOG.md does not exist")

          version = m_tag.group(1)
          content = changelog_path.read_text(encoding="utf-8")

          # Supported headings:
          # ## [1.2.3] - 2026-10-27
          # ## [2026.10.27.03-alpha] - 2026-10-27
          # ## 1.2.3
          # ## [Sin publicar] / ## [Unreleased]
          heading_re = re.compile(
              r"^##\s+\[?(Unreleased|Sin publicar|"
              r"(?:v)?(?:[0-9]+(?:\.[0-9]+)+(?:-[0-9a-zA-Z.]+)?)|(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)"
              r")\]?(?:\s+-\s+.*)?\s*$",
              re.MULTILINE | re.IGNORECASE,
          )

          matches = list(heading_re.finditer(content))
          if not matches:
              sys.exit("ERROR: No valid version headings found in CHANGELOG.md")

          sections = []
          for i, match in enumerate(matches):
              end = matches[i + 1].start() if i + 1 < len(matches) else len(content)
              sections.append((match.group(1), content[match.end():end].strip()))

          unreleased = [
              body for name, body in sections
              if name.lower() in ("unreleased", "sin publicar")
          ]

          # Fail if Unreleased contains actual notes.
          # An empty Unreleased section is allowed.
          for body in unreleased:
              meaningful = [
                  line.strip() for line in body.splitlines()
                  if line.strip()
                  and not re.fullmatch(r"[-*]\s*", line.strip())
              ]
              if meaningful:
                  sys.exit(
                      "ERROR: CHANGELOG.md still has pending Unreleased / Sin publicar notes. "
                      "Move them to the version being released or clear the section."
                  )

          version_sections = [
              (name.lstrip("v"), body) for name, body in sections
              if name.lower() not in ("unreleased", "sin publicar")
          ]

          names = [name for name, _ in version_sections]
          clean_version = version.lstrip("v")
          if names.count(clean_version) != 1:
              sys.exit(
                  f"ERROR: Expected exactly one CHANGELOG section for {clean_version}; "
                  f"found {names.count(clean_version)}"
              )

          current_index = names.index(clean_version)
          if not version_sections[current_index][1]:
              sys.exit(f"ERROR: CHANGELOG section for {clean_version} is empty")

          # Read previously published, non-draft releases.
          result = subprocess.run(
              [
                  "gh", "release", "list",
                  "--limit", "100",
                  "--json", "tagName,isDraft,isPrerelease,publishedAt",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          releases = json.loads(result.stdout)

          published = [
              r for r in releases
              if not r["isDraft"]
              and not r["isPrerelease"]
              and r.get("publishedAt")
          ]

          previous = published[0] if published else None

          if previous:
              previous_tag = previous["tagName"]
              previous_version = previous_tag.lstrip("v")

              if previous_version in names:
                  previous_index = names.index(previous_version)
                  if previous_index <= current_index:
                      sys.exit(
                          f"ERROR: CHANGELOG order is incorrect: {clean_version} must "
                          f"appear before {previous_version}."
                      )
                  selected = version_sections[current_index:previous_index]
              else:
                  selected = [version_sections[current_index]]
          else:
              # First release: include all versioned sections up to this tag.
              selected = version_sections[:current_index + 1]

          notes = []
          for name, body in selected:
              notes.append(f"## {name}\n\n{body}")

          if not notes:
              sys.exit("ERROR: No release notes could be generated")

          output = Path("release-notes.md")
          output.write_text("\n\n---\n\n".join(notes) + "\n", encoding="utf-8")

          print(f"Tag: {tag}")
          print(f"Previous published release: {previous['tagName'] if previous else 'none'}")
          print(f"Versions included: {', '.join(name for name, _ in selected)}")
          print(f"Release notes written to {output}")
          PY

      - name: Build release (Tauri no-bundle)
        run: |
          bun tauri build --no-bundle
          cp src-tauri/target/release/synapsers synapsers.Linux

      - name: Create GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --draft \
            synapsers.Linux
