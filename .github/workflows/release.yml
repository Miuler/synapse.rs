name: Rust Release

on:
  workflow_dispatch: # <- Esto habilita el botón manual
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, test and release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cargo-xwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "synapse-release-cache"
          cache-directories: |
            ~/.cache/xwin

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache APT Packages
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          # La clave cambia si modificas la lista de paquetes o semanalmente para evitar derivas
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            clang \
            lld \
            mold \
            llvm \
            nasm
          
          # Garantizar que llvm-lib exista en el PATH si la distro solo provee llvm-ar
          if ! command -v llvm-lib &> /dev/null; then
            sudo ln -sf "$(command -v llvm-ar)" /usr/local/bin/llvm-lib
          fi

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Verify tag and changelog
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 ci/release.py "$TAG" --generate-notes release-notes.md

      - name: Build release (Linux)
        run: bun tauri build --no-bundle

      - name: Build release (Windows)
        run: bun tauri build --no-bundle --target x86_64-pc-windows-msvc --runner cargo-xwin

      - name: Package and sign updater bundles
        env:
          TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          mkdir -p dist-release
          cp src-tauri/target/release/synapsers dist-release/synapsers
          cp src-tauri/target/x86_64-pc-windows-msvc/release/synapsers.exe dist-release/synapsers.exe

          # Comprimir bundles para updater
          tar -czf dist-release/synapsers-linux-x86_64.tar.gz -C dist-release synapsers
          (cd dist-release && zip -9 synapsers-windows-x86_64.zip synapsers.exe)

          # Firmar los bundles
          bun tauri signer sign dist-release/synapsers-linux-x86_64.tar.gz --app-version "$VERSION"
          bun tauri signer sign dist-release/synapsers-windows-x86_64.zip --app-version "$VERSION"

          LINUX_SIG=$(cat dist-release/synapsers-linux-x86_64.tar.gz.sig)
          WINDOWS_SIG=$(cat dist-release/synapsers-windows-x86_64.zip.sig)
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Generar manifiesto latest.json para el plugin updater de Tauri v2
          cat <<EOF > dist-release/latest.json
          {
            "version": "${VERSION}",
            "notes": "Synapse release ${TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/synapsers-linux-x86_64.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/synapsers-windows-x86_64.zip"
              }
            }
          }
          EOF

          # Validar formato json
          python3 -m json.tool dist-release/latest.json > dist-release/latest.formatted.json
          mv dist-release/latest.formatted.json dist-release/latest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            dist-release/synapsers \
            dist-release/synapsers.exe \
            dist-release/synapsers-linux-x86_64.tar.gz \
            dist-release/synapsers-linux-x86_64.tar.gz.sig \
            dist-release/synapsers-windows-x86_64.zip \
            dist-release/synapsers-windows-x86_64.zip.sig \
            dist-release/latest.json

  # macOS: se compila aparte y después de la publicación, para que un fallo en Mac no bloquee
  # Linux ni Windows. Sube sus archivos al release ya creado y suma las plataformas a latest.json.
  # Sin firma de Apple (no hay cuenta de desarrollador): macOS pedirá abrirlo con clic derecho → Abrir.
  release-macos:
    name: Build macOS
    needs: release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "synapse-release-macos-cache"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build macOS (Apple Silicon e Intel)
        run: |
          bun tauri build --bundles app --target aarch64-apple-darwin
          bun tauri build --bundles app --target x86_64-apple-darwin

      - name: Package, sign and upload
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p dist-macos
          for pair in aarch64-apple-darwin:darwin-aarch64 x86_64-apple-darwin:darwin-x86_64; do
            target="${pair%%:*}"
            platform="${pair##*:}"
            app_dir="src-tauri/target/$target/release/bundle/macos"
            app="$(basename "$(ls -d "$app_dir"/*.app | head -n1)")"
            out="dist-macos/synapsers-$platform.app.tar.gz"
            tar -czf "$out" -C "$app_dir" "$app"
            bun tauri signer sign "$out" --app-version "$VERSION"
          done

          # Sumar las plataformas de Mac al latest.json que dejó el job principal
          gh release download "$TAG" --pattern latest.json --dir dist-macos --clobber
          python3 - <<PY
          import json, os
          tag = os.environ["TAG"]
          repo = os.environ.get("GITHUB_REPOSITORY")
          p = "dist-macos/latest.json"
          data = json.load(open(p))
          for platform in ("darwin-aarch64", "darwin-x86_64"):
              name = f"synapsers-{platform}.app.tar.gz"
              data["platforms"][platform] = {
                  "signature": open(f"dist-macos/{name}.sig").read().strip(),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
              }
          json.dump(data, open(p, "w"), indent=2)
          PY

          gh release upload "$TAG" --clobber dist-macos/*.app.tar.gz dist-macos/*.sig dist-macos/latest.json
