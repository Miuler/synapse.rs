name: CodeQL

# Análisis estático de JavaScript/TypeScript y de Rust. Sin compilar (build-mode: none).
# Rust en CodeQL es relativamente nuevo: si falla (extractor, macros de Tauri…) el job de Rust no
# bloquea el resto (`continue-on-error` solo para ese lenguaje); revisa el log antes de ignorarlo.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 5 * * 2" # martes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.language == 'rust' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
