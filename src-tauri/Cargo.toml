[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0.151"
serde_json_lenient = "0.2.4"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.1", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2.10.0"
nucleo-matcher = "0.3"
nucleo = "0.5"
dashmap = { version = "6.2", features = ["serde"] }
bincode = { version = "2.0.0-rc.3", features = ["serde"] }
compact_str = { version = "0.8", features = ["serde"] }
jwalk = "0.8"
notify = "6.1"
pulldown-cmark = "0.12"
log = "0.4.34"
indicatif = { version = "0.18.6", features = ["tokio"] }
tracing-indicatif = "0.3.14"
indicatif-log-bridge = "0.2.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
rfd = "0.17.2"
encoding_rs = "0.8.42"
chardetng = "1.0.0"
base64 = "0.23.1"
gix = { version = "0.88.0", default-features = false, features = ["status", "parallel", "sha1"] }
notify-debouncer-mini = "0.7.0"
rayon = "1.10.0"
tantivy = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk-nvidia-quirk = "2.2.0"

[dev-dependencies]
tempfile = "3"
