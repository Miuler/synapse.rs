[package]
name = "synapsers"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0.154"
serde_json_lenient = "0.2.4"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.6", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2.9.2"
nucleo-matcher = "0.3"
nucleo = "0.5"
dashmap = { version = "6.2", features = ["serde"] }
bincode = { version = "2.0.0-rc.3", features = ["serde"] }
compact_str = { version = "0.10", features = ["serde"] }
jwalk = "0.9"
notify = "8.2"
pulldown-cmark = "0.13"
log = "0.4.34"
indicatif = { version = "0.18.4", features = ["tokio"] }
tracing-indicatif = "0.3.14"
indicatif-log-bridge = "0.2.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
rfd = "0.17.2"
encoding_rs = "0.8.35"
chardetng = "1.0.0"
base64 = "0.23.1"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
gix = { version = "0.90.0", default-features = false, features = [
  "status",
  "parallel",
  "sha1",
] }
rayon = "1.10.0"
tantivy = "0.26"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "bmp",
  "gif",
  "ico",
  "tiff",
] }
pixelmatch = "0.1"
quick-xml = "0.37"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
lopdf = "0.36"
serde_yaml = "0.9.34"
sha2 = "0.10"
similar = { version = "3.2.1", default-features = false, features = ["text"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk-nvidia-quirk = "2.3.0"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
