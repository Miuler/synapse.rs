[package]
name = "synapsers"
#version = "1.0.0-alpha.2"
description = "Synapsers - Notas"
authors = ["Hector Miuler Malpica Gallegos"]
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/Miuler/synapse.rs"
edition = "2024"
rust-version = "1.100.0"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["desktop"]
# Funcionalidades exclusivas de escritorio (diálogos nativos, portapapeles del SO, CLI, updater, quirks Linux).
desktop = [
  "dep:rfd",
  "dep:arboard",
  "dep:tauri-plugin-cli",
  "dep:webkit2gtk-nvidia-quirk",
]
# Herramientas para desarrollar Synapse: el modo feedback del MCP (`report_feedback`).
develop = []

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }
anyhow = "1"
vergen = { version = "10.0.4", features = ["build"] }
vergen-gix = { version = "10.0.4", features = ["build"] }

[dependencies]
serde_json = "1.0.154"
serde_json_lenient = "0.2.4"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.7", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2.10.2"
nucleo-matcher = "0.3"
nucleo = "0.5"
dashmap = { version = "6.2", features = ["serde"] }
postcard = { version = "1.2", features = ["use-std"] }
compact_str = { version = "0.10", features = ["serde"] }
jwalk = "0.9"
regex = "1.13"
notify = "9.0"
pulldown-cmark = "0.13"
log = "0.4.35"
tracing = "0.1.44"
rfd = { version = "0.18", optional = true }
arboard = { version = "3.7", default-features = false, optional = true, features = [
  "wayland-data-control",
] }
encoding_rs = "0.8.44"
chardetng = "1.0.0"
base64 = "0.23.1"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
gix = { version = "0.90.0", default-features = false, features = [
  "status",
  "parallel",
  "sha1",
] }
rayon = "1.12.0"
tantivy = "0.27"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "bmp",
  "gif",
  "ico",
  "tiff",
] }
pixelmatch = "0.1"
quick-xml = "0.42"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
lopdf = "0.47"
serde_yaml = "0.9.34"
sha2 = "0.11"
similar = { version = "3.2.1", default-features = false, features = ["std", "text"] }
tauri-plugin-cli = { version = "2.5.0", optional = true }
tauri-plugin-notification = "2"
object_store = { version = "0.14.2", default-features = false, features = [
  "fs",
] }
futures-executor = "0.3.34"
flate2 = "1.1"
tar = "0.4"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "process",
  "io-util",
  "sync",
  "time",
] }
calamine = { version = "0.38", default-features = false }
# Beta fijada: la 3.x estable arrastra zip 8, con vulnerabilidades conocidas (RUSTSEC-2026-0548 y otras)
umya-spreadsheet = "=4.0.0-beta.1"

[target.'cfg(target_os = "linux")'.dependencies]
# La misma que usa tauri-plugin-notification: sin ella no se puede enviar la imagen de la notificación
notify-rust = "4"
webkit2gtk-nvidia-quirk = { version = "2.3.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[lints.clippy]
# `note::note`: un módulo por capa y su tipo principal con el mismo nombre
module_inception = "allow"
# En las pruebas propone `iter().any(…)` en vez de `contains(&"x".to_string())`, menos legible
unnecessary_to_owned = "allow"

[dev-dependencies]
tracing-indicatif = "0.3.14"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Menos información de depuración: binarios y enlazados más livianos; los backtraces siguen
# mostrando archivo y línea.
[profile.dev]
debug = "line-tables-only"

# Leer hojas de cálculo grandes sin optimizar es ~10 veces más lento: en desarrollo también se optimizan
[profile.dev.package.umya-spreadsheet]
opt-level = 3
[profile.dev.package.calamine]
opt-level = 3
[profile.dev.package.quick-xml]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.test]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
